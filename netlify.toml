[build]
  # Concatenates the block stylesheets into assets/ before publishing.
  # The built files are committed too, so the site still works if opened
  # straight from disk without running the build.
  command = "npm run build:css"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
