[build]
  # Concatenates the block stylesheets, then embeds them into each page and
  # makes the web font request non-blocking. Firefox paints before external
  # stylesheets arrive, so anything left as a request can flash unstyled.
  # The committed HTML keeps its <link>; only the deployed copy is rewritten.
  command = "npm run build"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
